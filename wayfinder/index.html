<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121731">
  <meta name="description" content="Wayfinder: A Journey Through Life with God. A Christian, story-driven reflection game for older teens and adults.">
  <title>Wayfinder — A Journey Through Life with God</title>
  <meta property="og:title" content="Wayfinder — A Journey Through Life with God">
  <meta property="og:description" content="Eight stories from Scripture for life’s hardest seasons. Explore, reflect, and leave with one wise next step.">
  <meta property="og:image" content="https://games.thecuriousseekers.com/images/wayfinder.jpg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121731'/%3E%3Cpath d='M32 10 L36 28 L54 32 L36 36 L32 54 L28 36 L10 32 L28 28 Z' fill='%23f0b96e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Painted backdrop behind menu-style screens -->
    <div id="backdrop" class="backdrop" aria-hidden="true"></div>

    <!-- The explorable world (adventure step) -->
    <div id="stage" class="stage" hidden></div>

    <!-- Persistent top bar -->
    <header class="topbar" id="topbar">
      <button class="brand" id="btn-home" type="button" aria-label="Wayfinder — return home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l1.6 7.4L21 12l-7.4 1.6L12 21l-1.6-7.4L3 12l7.4-1.6z" fill="currentColor"/></svg>
        <span>Wayfinder</span>
      </button>
      <nav class="progress" id="progress" aria-label="Journey progress"></nav>
      <div class="top-actions">
        <button class="icon-btn" id="btn-sound" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5c1.2 1 1.8 2.2 1.8 3.5s-.6 2.5-1.8 3.5M18.5 6c2 1.6 3 3.6 3 6s-1 4.4-3 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="mute" d="M16.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="label">Sound off</span>
        </button>
        <button class="icon-btn support-btn" id="btn-support" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span class="label">Support</span>
        </button>
        <button class="icon-btn" id="btn-menu" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          <span class="label">Pause</span>
        </button>
      </div>
    </header>

    <!-- Menu-style screens (title, check-in, reflection, scripture...) -->
    <main id="screen" class="screen" tabindex="-1"></main>

    <!-- Adventure heads-up display -->
    <div id="hud" class="hud" hidden>
      <div class="hud-area" id="hud-area"></div>
      <div class="hud-objective" id="hud-objective" aria-live="polite"></div>
      <div class="hud-finds" id="hud-finds"></div>
    </div>

    <!-- Touch controls -->
    <div id="controls" class="controls" hidden>
      <button class="ctrl ctrl-dir" id="ctrl-left" type="button" aria-label="Walk left">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="ctrl ctrl-act" id="ctrl-act" type="button" disabled>
        <span class="act-verb">Walk on</span>
        <span class="act-target" id="ctrl-act-target">Use the arrows or tap the path</span>
      </button>
      <button class="ctrl ctrl-dir" id="ctrl-right" type="button" aria-label="Walk right">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <p class="kbd-hint">← → walk · Space look closer · Esc pause</p>
    </div>

    <!-- In-world dialogue -->
    <section id="dialog" class="dialog" hidden aria-live="polite"></section>

    <!-- Sound captions -->
    <div id="captions" class="captions" aria-live="polite"></div>

    <!-- Short notices -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Full-screen effects (rest, stillness) -->
    <div id="veil" class="veil" hidden></div>

    <!-- Modal layer (pause, settings, pages, support) -->
    <div id="modal" class="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal-card"></div>
    </div>

    <!-- Crisis support: always above everything else -->
    <div id="crisis" class="modal crisis" hidden>
      <div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="crisis-title" id="crisis-card"></div>
    </div>
  </div>

  <noscript>
    <p style="padding:24px;color:#f6efe2;background:#121731;font-family:Georgia,serif">Wayfinder needs JavaScript to run. If you need support right now, please contact your local emergency number or a crisis line such as 988 (US/Canada) or Samaritans 116 123 (UK/Ireland).</p>
  </noscript>

  <!-- Plain scripts (no build step) so the game also runs from file:// -->
  <script src="src/core.js"></script>
  <script src="src/storage.js"></script>
  <script src="src/support.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/voice.js"></script>
  <!-- Pre-generated voice clips (tools/voices.py). Empty until clips are generated. -->
  <script src="audio/voice/manifest.js"></script>
  <script src="src/art.js"></script>
  <script src="src/art-more.js"></script>
  <script src="src/world.js"></script>
  <script src="src/content/companions.js"></script>
  <script src="src/content/journeys/elijah.js"></script>
  <script src="src/content/journeys/gideon.js"></script>
  <script src="src/content/journeys/naomi.js"></script>
  <script src="src/content/journeys/hagar.js"></script>
  <script src="src/content/journeys/joseph.js"></script>
  <script src="src/content/journeys/peter.js"></script>
  <script src="src/content/journeys/david.js"></script>
  <script src="src/content/journeys/samson.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
